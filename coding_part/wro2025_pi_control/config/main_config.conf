# main_config.conf
# Main configuration for the Pi Control Software

# Serial Port Configuration
SERIAL_PORT="/dev/ttyUSB0"
BAUD_RATE=115200

# Communication Timings (milliseconds)
HEARTBEAT_INTERVAL=200
COMM_TIMEOUT=1000

# File Paths
SENSOR_DATA_FILE="/tmp/nano_sensor_data.json"
COMMAND_QUEUE_FILE="/tmp/pi_commands.fifo"
STATE_FILE="/tmp/pi_state.json"
LOG_DIR="/home/pi/wro2025_pi_control/logs"

# Vehicle Parameters (Example)
MAX_MOTOR_SPEED=200
SERVO_CENTER_ANGLE=90
SERVO_RANGE=60 # e.g., 90 +/- 60 = 30 to 150 degrees

# Challenge Parameters
LAP_COUNT_TARGET=3